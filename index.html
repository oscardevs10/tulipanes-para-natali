<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tulipanes para Natali</title>
  <meta name="description" content="Un jarrón de tulipanes que florecen para Natali." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Dancing+Script:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="scene" role="img" aria-label="Jarrón de cristal con tulipanes lila, durazno, amarillo y blanco que florecen lentamente; arrastra para girarlo"></canvas>

  <header class="top">
    <p class="eyebrow">Flores que nunca se marchitan, para alguien que alegra mis días</p>
    <h1 class="display">Tulipanes <em>para Natali</em></h1>
  </header>

  <footer class="bar">
    <button class="pill" id="replay">
      Verlas florecer de nuevo
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
    </button>
    <p class="stats">
      <span>Floración <b id="bloom">0%</b></span>
      <span><b id="flower-count">15</b> tulipanes</span>
      <span><b id="petal-count">—</b> pétalos</span>
    </p>
  </footer>

  <script type="module" src="/main.js"></script>
</body>
</html>
